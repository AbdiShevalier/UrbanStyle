# Render · despliegue del backend (y app completa) de Urban Style
# Crea un servicio web desde este repo y Render leerá este archivo.
services:
  - type: web
    name: urban-style-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false            # se introduce en el dashboard de Render
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_TRYON_MODEL
        value: cuuupid/idm-vton
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGIN
        value: "*"
