<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/><stop offset="1" stop-color="#ece4d6"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ece4d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7a6a4a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="300" rx="240" ry="240" fill="url(#vig)"/>
  <g filter="url(#sh)">
    <g transform="translate(300,300)">
      <rect x="-150" y="-50" width="120" height="90" rx="26" fill="#15151a" stroke="#0b0b0e" stroke-width="5"/>
      <rect x="30" y="-50" width="120" height="90" rx="26" fill="#15151a" stroke="#0b0b0e" stroke-width="5"/>
      <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#0b0b0e" stroke-width="8"/>
      <line x1="-150" y1="-36" x2="-200" y2="-52" stroke="#0b0b0e" stroke-width="8"/>
      <line x1="150" y1="-36" x2="200" y2="-52" stroke="#0b0b0e" stroke-width="8"/>
    </g></g>
  <rect x="34" y="34" width="120" height="3" fill="#caa85a" opacity="0.8"/>
  <text x="34" y="560" font-family="Montserrat,Arial" font-size="15" letter-spacing="4"
        fill="#8a7a55">DIOR</text>
  <text x="34" y="582" font-family="Georgia,serif" font-size="13" fill="#b6a988">Gafas Solar</text>
</svg>